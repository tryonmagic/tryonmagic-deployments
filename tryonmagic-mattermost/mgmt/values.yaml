postgresql:
  enabled: true
  auth:
    username: mmuser
    database: mattermost
  primary:
    persistence:
      enabled: true
      size: 2Gi
  metrics:
    enabled: false

minio:
  enabled: true
  mode: standalone
  defaultBuckets: "mattermost"
  serviceEndpoint: "minio"
  servicePort: 9000
  region: us-east-1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

mattermost:
  name: mm
  image:
    repository: mattermost/mattermost-team-edition
    tag: latest
  replicas: 1
  ingress:
    enabled: true
    host: mattermost.example.com
    className: traefik
  fileStore:
    bucket: mattermost
    region: us-east-1
    endpoint: minio:9000
  config:
    ServiceSettings:
      SiteURL: "https://mattermost.tryonmagic.com"
