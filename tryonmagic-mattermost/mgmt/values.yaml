postgresql:
  enabled: true
  auth:
    username: mmuser
    database: mattermost
  primary:
    persistence:
      enabled: true
      size: 2Gi
  metrics:
    enabled: false

minio:
  enabled: true
  mode: standalone
  defaultBuckets: "mattermost"
  # Service address Mattermost will use (cluster-internal)
  serviceEndpoint: "minio"
  servicePort: 9000
  region: us-east-1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi