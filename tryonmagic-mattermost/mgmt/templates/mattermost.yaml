{{- $ns := .Release.Namespace -}}
{{- $mm := .Values.mattermost -}}
{{- $minio := .Values.minio -}}
{{- $exts3 := .Values.externalS3 | default (dict) -}}
{{- if and $minio.enabled (default false $exts3.enabled) -}}
{{- fail "Configuration error: both minio.enabled and externalS3.enabled are true. Enable exactly one object store (MinIO or externalS3)." -}}
{{- end -}}
{{- if and (not $minio.enabled) (not (default false $exts3.enabled)) -}}
{{- fail "Configuration error: neither MinIO nor externalS3 is enabled. Enable one to provide Mattermost file storage." -}}
{{- end -}}
{{- $s3Bucket := "" -}}
{{- $s3Endpoint := "" -}}
{{- $s3Region := "" -}}
{{- if $minio.enabled -}}
  {{- $s3Bucket = default "mattermost" $minio.defaultBuckets -}}
  {{- $s3Endpoint = printf "%s:%d" (default "minio" $minio.serviceEndpoint) (int (default 9000 $minio.servicePort)) -}}
  {{- $s3Region = default "us-east-1" .Values.minio.region -}}
{{- else -}}
  {{- $s3Bucket = $exts3.bucket -}}
  {{- $s3Endpoint = $exts3.endpoint -}}
  {{- $s3Region = $exts3.region -}}
{{- end -}}
{{- $host := tpl $mm.ingress.host . -}}
{{- $hostSlug := replace "." "-" $host -}}
{{- $fullDefault := printf "%s-tls" (include "tryonmagic-mattermost.fullname" .) -}}
{{- $hostDefault := printf "%s-tls" $hostSlug -}}
{{- $strategy := default "host" .Values.tls.tlsSecretNameStrategy -}}
{{- $generated := ternary $hostDefault $fullDefault (eq $strategy "host") -}}
{{- $tlsSecretAuto := and .Values.tls.autoGenerateTlsSecretName (not $mm.ingress.tlsSecret) -}}
{{- $tlsSecretFinal := ternary $generated $mm.ingress.tlsSecret $tlsSecretAuto -}}
{{- $ingClass := default "nginx" $mm.ingress.className -}}
{{- $replicas := default 2 $mm.replicas -}}
{{- $sqlDriver := default "postgres" $mm.config.SqlSettings.DriverName -}}
{{- $fileDriver := default "amazons3" $mm.config.FileSettings.DriverName -}}
{{- /* Map shorthand CRD names to valid apiVersions */ -}}
{{- $apiRaw := default "installation.mattermost.com/v1alpha1" $mm.apiVersion -}}
{{- $apiFinal := $apiRaw -}}
{{- if eq $apiRaw "mattermosts.installation.mattermost.com" -}}
  {{- $apiFinal = "installation.mattermost.com/v1alpha1" -}}
{{- else if eq $apiRaw "mattermosts.mattermost.com" -}}
  {{- $apiFinal = "mattermost.com/v1beta1" -}}
{{- end -}}
apiVersion: {{ $apiFinal }}
kind: Mattermost
metadata:
  name: {{ $mm.name }}
  namespace: {{ default $ns $mm.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  image: {{ $mm.image.repository }}:{{ $mm.image.tag }}
  replicas: {{ $replicas }}
  ingress:
    enabled: {{ $mm.ingress.enabled }}
    host: {{ $host | quote }}
    class: {{ $ingClass | quote }}
    {{- if or $mm.ingress.tlsSecret $tlsSecretAuto }}
    tlsSecret: {{ $tlsSecretFinal | quote }}
    {{- end }}

  # Use external database via DSN secret (Operator supports external DB)
  database:
    external:
      secret: mm-db-dsn

  fileStore:
    external:
      s3:
        secret: mm-s3
        bucket: {{ $s3Bucket | quote }}
        region: {{ $s3Region | quote }}
        endpoint: {{ $s3Endpoint | quote }}

  # Map high-level config into config.json
  config:
    ServiceSettings:
      SiteURL: {{ tpl $mm.config.ServiceSettings.SiteURL . | quote }}
    SqlSettings:
      DriverName: {{ $sqlDriver | quote }}
      DataSource: "$(DATASOURCE)"
    FileSettings:
      DriverName: {{ $fileDriver | quote }}
      AmazonS3Bucket: {{ $s3Bucket | quote }}
      AmazonS3Endpoint: {{ $s3Endpoint | quote }}
      AmazonS3Region: {{ $s3Region | quote }}
      AmazonS3SSL: {{ ternary false true $minio.enabled }}

  # Inject secrets as environment variables into the Mattermost pods
  extraEnvVars:
    - name: DATASOURCE
      valueFrom:
        secretKeyRef:
          name: mm-db-dsn
          key: DATASOURCE
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_REGION
    - name: AWS_S3_FORCE_PATH_STYLE
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_S3_FORCE_PATH_STYLE
    - name: AWS_S3_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_S3_ENDPOINT
    - name: AWS_S3_BUCKET
      valueFrom:
        secretKeyRef:
          name: mm-s3
          key: AWS_S3_BUCKET
