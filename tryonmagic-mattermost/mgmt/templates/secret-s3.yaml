{{- $ns := .Release.Namespace -}}
{{- $minio := .Values.minio -}}
{{- $exts3 := .Values.externalS3 | default (dict) -}}
{{- if and $minio.enabled (default false $exts3.enabled) -}}
{{- fail "Configuration error: both minio.enabled and externalS3.enabled are true. Enable exactly one object store (MinIO or externalS3)." -}}
{{- end -}}
{{- if and (not $minio.enabled) (not (default false $exts3.enabled)) -}}
{{- fail "Configuration error: neither MinIO nor externalS3 is enabled. Enable one to provide Mattermost file storage." -}}
{{- end -}}
{{- $minioSecretName := printf "%s-minio" .Release.Name -}}
{{- $minioSecret := (lookup "v1" "Secret" $ns $minioSecretName) -}}
{{- $minioUser := "" -}}
{{- $minioPass := "" -}}
{{- if and $minio.enabled $minioSecret }}
  {{- /* Try multiple key conventions across charts */ -}}
  {{- $minioUser = (coalesce (and $minioSecret.data (index $minioSecret.data "root-user")) (and $minioSecret.data (index $minioSecret.data "rootUser")) (and $minioSecret.data (index $minioSecret.data "accesskey")) (and $minioSecret.data (index $minioSecret.data "accessKey")) ) -}}
  {{- $minioPass = (coalesce (and $minioSecret.data (index $minioSecret.data "root-password")) (and $minioSecret.data (index $minioSecret.data "rootPassword")) (and $minioSecret.data (index $minioSecret.data "secretkey")) (and $minioSecret.data (index $minioSecret.data "secretKey")) ) -}}
  {{- if $minioUser }}{{- $minioUser = (b64dec $minioUser) -}}{{- end -}}
  {{- if $minioPass }}{{- $minioPass = (b64dec $minioPass) -}}{{- end -}}
{{- end -}}
{{- $minioEndpoint := printf "%s:%d" (default "minio" $minio.serviceEndpoint) (int (default 9000 $minio.servicePort)) -}}
{{- $minioRegion := default "us-east-1" .Values.minio.region -}}
{{- $minioBucket := default "mattermost" $minio.defaultBuckets -}}
apiVersion: v1
kind: Secret
metadata:
  name: mm-s3
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ include "tryonmagic-mattermost.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
data:
  # Values may be empty on first render; post-install hook will repopulate after MinIO/external S3 is available
  AWS_ACCESS_KEY_ID: {{- if $minio.enabled -}} {{- if $minioUser -}} {{ $minioUser | b64enc | quote }} {{- else -}} {{ "" | b64enc | quote }} {{- end -}} {{- else -}} {{ $exts3.accessKey | b64enc | quote }} {{- end }}
  AWS_SECRET_ACCESS_KEY: {{- if $minio.enabled -}} {{- if $minioPass -}} {{ $minioPass | b64enc | quote }} {{- else -}} {{ "" | b64enc | quote }} {{- end -}} {{- else -}} {{ $exts3.secretKey | b64enc | quote }} {{- end }}
  AWS_REGION: {{- if $minio.enabled -}} {{ $minioRegion | b64enc | quote }} {{- else -}} {{ $exts3.region | b64enc | quote }} {{- end }}
  AWS_S3_FORCE_PATH_STYLE: {{- if $minio.enabled -}} {{ "true" | b64enc | quote }} {{- else -}} {{ printf "%v" $exts3.forcePathStyle | b64enc | quote }} {{- end }}
  AWS_S3_ENDPOINT: {{- if $minio.enabled -}} {{ $minioEndpoint | b64enc | quote }} {{- else -}} {{ $exts3.endpoint | b64enc | quote }} {{- end }}
  AWS_S3_BUCKET: {{- if $minio.enabled -}} {{ $minioBucket | b64enc | quote }} {{- else -}} {{ $exts3.bucket | b64enc | quote }} {{- end }}
