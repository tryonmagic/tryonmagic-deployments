{{- $ns := .Release.Namespace -}}
{{- $minio := .Values.minio -}}
{{- $exts3 := .Values.externalS3 | default (dict) -}}
{{- if and $minio.enabled (default false $exts3.enabled) -}}
{{- fail "Configuration error: both minio.enabled and externalS3.enabled are true. Enable exactly one object store (MinIO or externalS3)." -}}
{{- end -}}
{{- if and (not $minio.enabled) (not (default false $exts3.enabled)) -}}
{{- fail "Configuration error: neither MinIO nor externalS3 is enabled. Enable one to provide Mattermost file storage." -}}
{{- end -}}
{{- $minioSecretName := printf "%s-minio" .Release.Name -}}
{{- $minioSecret := (lookup "v1" "Secret" $ns $minioSecretName) -}}
{{- $minioUser := "" -}}
{{- $minioPass := "" -}}
{{- if and $minio.enabled $minioSecret }}
  {{- $minioUser = (index $minioSecret.data "root-user" | b64dec) -}}
  {{- $minioPass = (index $minioSecret.data "root-password" | b64dec) -}}
{{- end -}}
{{- $minioEndpoint := printf "%s:%d" (default "minio" $minio.serviceEndpoint) (int (default 9000 $minio.servicePort)) -}}
{{- $minioRegion := default "us-east-1" .Values.minio.region -}}
{{- $minioBucket := default "mattermost" $minio.defaultBuckets -}}
apiVersion: v1
kind: Secret
metadata:
  name: mm-s3
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ include "tryonmagic-mattermost.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
stringData:
  AWS_ACCESS_KEY_ID: {{- if $minio.enabled -}} {{- if $minioUser -}} {{ $minioUser | quote }} {{- else -}} {{ fail (printf "MinIO root-user not found in Secret %s/%s" $ns $minioSecretName) }} {{- end -}} {{- else -}} {{ $exts3.accessKey | quote }} {{- end }}
  AWS_SECRET_ACCESS_KEY: {{- if $minio.enabled -}} {{- if $minioPass -}} {{ $minioPass | quote }} {{- else -}} {{ fail (printf "MinIO root-password not found in Secret %s/%s" $ns $minioSecretName) }} {{- end -}} {{- else -}} {{ $exts3.secretKey | quote }} {{- end }}
  AWS_REGION: {{- if $minio.enabled -}} {{ $minioRegion | quote }} {{- else -}} {{ $exts3.region | quote }} {{- end }}
  AWS_S3_FORCE_PATH_STYLE: {{- if $minio.enabled -}} {{ "true" | quote }} {{- else -}} {{ printf "%v" $exts3.forcePathStyle | quote }} {{- end }}
  AWS_S3_ENDPOINT: {{- if $minio.enabled -}} {{ $minioEndpoint | quote }} {{- else -}} {{ $exts3.endpoint | quote }} {{- end }}
  AWS_S3_BUCKET: {{- if $minio.enabled -}} {{ $minioBucket | quote }} {{- else -}} {{ $exts3.bucket | quote }} {{- end }}
