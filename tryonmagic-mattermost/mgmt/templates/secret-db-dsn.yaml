{{- $ns := .Release.Namespace -}}
{{- $db := .Values.postgresql -}}
{{- $extdb := .Values.externalDatabase | default (dict) -}}
{{- $pgSecretName := printf "%s-postgresql" .Release.Name -}}
{{- $pgSecret := (lookup "v1" "Secret" $ns $pgSecretName) -}}
{{- $pgPass := "" -}}
{{- if and $db.enabled $pgSecret }}
  {{- $pgPass = (index $pgSecret.data "password" | b64dec) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: mm-db-dsn
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ include "tryonmagic-mattermost.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
stringData:
  # Standard PostgreSQL DSN used by Mattermost (SqlSettings.DataSource)
  DATASOURCE: {{- if $db.enabled -}}
    {{- if $pgPass -}}
      {{ printf "postgres://%s:%s@%s-postgresql.%s.svc.cluster.local:5432/%s?sslmode=disable" $db.auth.username $pgPass .Release.Name $ns $db.auth.database | quote }}
    {{- else -}}
      {{- fail (printf "PostgreSQL password not found in Secret %s/%s; ensure subchart installed first" $ns $pgSecretName) -}}
    {{- end -}}
  {{- else if (default false $extdb.enabled) -}}
    {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s" $db.auth.username $extdb.password $extdb.host (int $extdb.port) $db.auth.database $extdb.sslmode | quote }}
  {{- else -}}
    {{ fail "Either postgresql.enabled or externalDatabase.enabled must be true" }}
  {{- end }}
