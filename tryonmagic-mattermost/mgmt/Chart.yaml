apiVersion: v2
name: tryonmagic-mattermost
version: 0.1.0
description: Umbrella chart to install Mattermost Operator, Mattermost app, PostgreSQL, and MinIO
kubeVersion: ">=1.24.0-0"
type: application

dependencies:
  - name: mattermost-operator
    version: 1.26.0
    repository: https://helm.mattermost.com
    condition: mattermostOperator.enabled

  - name: postgresql
    version: 15.5.26
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  - name: minio
    version: 14.8.18
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled
