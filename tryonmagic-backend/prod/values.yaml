deployment:
  microservice:
    name: "prod-tryonmagic-backend"
    namespace: "tryonmagic"

  container:
    image:
      repository: "443938609437.dkr.ecr.us-east-2.amazonaws.com/tryonmagic-backend"
    ports:
      - name: "http"
        port: 3000
    resource:
      replica:
        min: "1"
        max: "2"
      scale_threshold:
        cpu: "70"
        memory: "70"
      cpu:
        request: 100m
        limit: 200m
      memory:
        request: 128Mi
        limit: 256Mi
    terminate:
      grace_period: "30"

  migration:
    enabled: false

  service_account:
    enabled: true
    role_arn: "arn:aws:iam::443938609437:role/prod-tryonmagic-backend"

  secrets:
    enabled: true
    provider: "aws"

  env_vars:
    enabled: true

  service:
    type: "NodePort"
    ports:
      - name: http
        port: 3000

  health_check:
    enabled: false
