apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tryonmagic-secret-manager
  namespace: argocd
spec:
  project: tryonmagic
  sources:
    - repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      chart: secrets-store-csi-driver
      targetRevision: 1.5.1
      helm:
        releaseName: secrets-store-csi-driver
        values: |
          syncSecret:
            enabled: true
          enableSecretRotation: true
    - repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
      chart: secrets-store-csi-driver-provider-aws
      targetRevision: 1.0.1
      helm:
        releaseName: secrets-provider-aws
        values: |
          image:
            repository: public.ecr.aws/aws-secrets-manager/secrets-store-csi-driver-provider-aws
            tag: 1.0.r2-50-g5b4aca1-2023.06.09.21.19
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
          nodeSelector: {}
          tolerations: []
  destination:
    server: https://kube.tryonmagic.com:6443
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true