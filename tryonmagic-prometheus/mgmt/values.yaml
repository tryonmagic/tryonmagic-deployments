kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      storageSpec:
        emptyDir: {}
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
  alertmanager:
    enabled: false
  prometheusOperator:
    enabled: true
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true
  grafana:
    enabled: false