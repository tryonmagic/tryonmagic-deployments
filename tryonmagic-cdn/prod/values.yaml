deployment:
  microservice:
    name: "prod-tryonmagic-cdn"
    namespace: "prod"

  container:
    image:
      repository: " 551588892498.dkr.ecr.us-west-2.amazonaws.com/prod-tryonmagic-cdn"
    ports:
      - name: "http"
        port: 3000
    resource:
      replica:
        min: "1"
        max: "1"
      scale_threshold:
        cpu: "70"
        memory: "70"
      cpu:
        request: 250m
        limit: 1000m
      memory:
        request: 512Mi
        limit: 2048Mi
    terminate:
      grace_period: "30"

  migration:
    enabled: false

  service_account:
    enabled: false

  secrets:
    enabled: false
    provider: "aws"

  env_vars:
    enabled: true

  service:
    type: "NodePort"
    ports:
      - name: http
        port: 3000

  health_check:
    enabled: false
