apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prod-tryonmagic-client
  namespace: prod
spec:
  ingressClassName: traefik
  rules:
    - host: app.tryonmagic.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-tryonmagic-client
                port:
                  number: 3000
